workflows:
  vgmp-debug:
    name: VGMP Android Debug
    max_build_duration: 120

    scripts:
      - |
        echo "=== Setting Android SDK location ==="
        echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - |
        echo "=== Initializing and verifying Git submodules ==="

        echo "=== Git submodule configuration ==="
        git submodule status --recursive || true

        echo "=== Synchronizing submodule URLs ==="
        git submodule sync --recursive

        echo "=== Initializing submodules ==="
        git submodule update --init --recursive

        echo "=== Submodule status after initialization ==="
        git submodule status --recursive
      - |
        echo "=== Preparing native libraries ==="
        ./app/src/main/cpp/prepare_libvgm_source.sh
        ./app/src/main/cpp/prepare_libkss_source.sh

      - |
        echo "=== Creating temporary signing key ==="
        keytool -genkeypair \
          -v \
          -keystore "$CM_BUILD_DIR/app/vgmp.keystore" \
          -alias vgmp \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass vgmp-build \
          -keypass vgmp-build \
          -dname "CN=VGMP Build,O=VGMP,C=US"

        cat > "$CM_BUILD_DIR/app/keystore.properties" <<EOF
        storeFile=vgmp.keystore
        storePassword=vgmp-build
        keyAlias=vgmp
        keyPassword=vgmp-build
        EOF

      - |
        echo "=== Building debug APK ==="
        ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
